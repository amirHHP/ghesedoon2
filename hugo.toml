baseURL = 'https://ghesedoon.ir/'
theme = 'PaperMod'
defaultContentLanguage = 'fa'
defaultContentLanguageInSubdir = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  includeNewer = true
  threshold = 60
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "title"
    weight = 10

[params]
  env = "production"
  defaultTheme = "auto"
  defaultAppearance = "light"
  displayFullLangName = true
  mainSections = ["posts"]
  images = ["/og-image.png"]

  [params.cover]
    hiddenInSingle = true

  [params.fuseOpts]
    keys = ["title", "summary"]
    threshold = 0.3
    ignorelocation = true
    minmatchcharlength = 2

[languages]
  [languages.fa]
    label = "فارسی"
    locale = "fa-IR"
    direction = "rtl"
    title = "قصه دون"
    weight = 1

    [languages.fa.params]
      rtl = true
      description = "قصه‌های کودکانه قصه دون"

    [[languages.fa.menu.main]]
      identifier = "search"
      name = "جستجو"
      url = "/search/"
      weight = 5

    [[languages.fa.menu.main]]
      identifier = "tags"
      name = "برچسب‌ها"
      url = "/tags/"
      weight = 10

    [[languages.fa.menu.main]]
      identifier = "donate"
      name = "حمایت مالی"
      url = "/donate/"
      weight = 20

  [languages.en]
    label = "English"
    locale = "en"
    direction = "ltr"
    title = "Ghesedoon"
    weight = 2

    [languages.en.params]
      rtl = false
      description = "Children's stories from Ghesedoon"

    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 5

    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "donate"
      name = "Donate"
      url = "/donate/"
      weight = 20
